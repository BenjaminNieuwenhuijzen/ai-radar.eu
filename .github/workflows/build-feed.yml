name: Build combined feed

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - name: Build feed.xml, data.json and digest.json
        run: node scripts/build-feed.mjs
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml data.json img
          if [ -f digest.json ]; then git add digest.json; fi
          git diff --cached --quiet && exit 0
          git commit -m "Update feed data"
          # Another writer (model-history, source-health, a manual push) may have pushed in
          # the meantime; they touch other files, so a rebase is enough. The retry also
          # covers a transient network or GitHub error on the pull or push.
          for i in 1 2 3; do
            if git pull --rebase && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
