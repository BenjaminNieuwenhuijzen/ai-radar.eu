name: Model History auto-merge

# A cloud Claude routine (claude.ai, daily) works the open "new-model" issues: it adds the
# record, its sources and aliases on a claude/ branch whose head commit carries
# "[model-history]". This workflow checks such a push the way the main build would (merged
# with the current main: only curated data files changed, validate, tests, validate again
# after news matching) and, when everything passes, pushes it to main as one squash commit
# and starts the Model History build (a push made with GITHUB_TOKEN does not trigger the
# push workflows; a dispatch does). On a failure it comments on the linked issues, so the owner
# gets a notification. Nothing here runs on anyone's computer.
on:
  push:
    branches: ["claude/**"]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: model-history-auto
  cancel-in-progress: false

jobs:
  merge:
    if: contains(github.event.head_commit.message, '[model-history]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Merge the current main into the branch (locally)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - name: Only curated data files changed
        run: |
          bad=$(git diff --name-only origin/main HEAD | grep -vE '^model-history/(records/[a-z0-9-]+/[a-z0-9.-]+\.json|sources/[a-z0-9-]+\.json|families\.json|organizations\.json)$' || true)
          if [ -n "$bad" ]; then echo "::error::Files outside the curated Model History data:"; echo "$bad"; exit 1; fi
          git diff --quiet origin/main HEAD && { echo "::error::No changes against main"; exit 1; } || true
      - name: Validate
        run: node scripts/model-history/validate.mjs
      - name: Tests
        run: node --test "scripts/model-history/test/*.test.mjs"
      - name: Validate after news matching (as the main build does)
        run: node scripts/model-history/match-news.mjs && node scripts/model-history/validate.mjs
      # One squash commit on main, pushed like the build bot's own commits (GitHub Actions may
      # not open pull requests in this repository). The commit lists the branch commits.
      - name: Squash the branch onto main and push
        run: |
          git reset -q --hard   # drop the local news-matching output and the test merge
          git log --reverse --format='%B' origin/main.."$GITHUB_SHA" | sed 's/\s*\[model-history\]//I' > "$RUNNER_TEMP/body.txt"
          title=$(git log -1 --format=%s "$GITHUB_SHA" | sed 's/\s*\[model-history\]//I')
          grep -oiE '(closes|fixes|resolves) #[0-9]+' "$RUNNER_TEMP/body.txt" | grep -oE '[0-9]+' | sort -u > "$RUNNER_TEMP/issues.txt" || true
          { echo "$title"; echo; cat "$RUNNER_TEMP/body.txt"; echo; echo "Added by the Model History cloud routine (branch ${GITHUB_REF_NAME}) and merged automatically after the checks in model-history-auto.yml passed."; } > "$RUNNER_TEMP/msg.txt"
          git checkout -q -B publish origin/main
          git merge --squash "$GITHUB_SHA"
          git commit -q -F "$RUNNER_TEMP/msg.txt"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
      - name: Close the issues, delete the branch, start the build
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const issues = fs.readFileSync(`${process.env.RUNNER_TEMP}/issues.txt`, "utf8").split("\n").filter(Boolean);
            for (const n of issues) {
              try {
                await github.rest.issues.createComment({ ...context.repo, issue_number: Number(n), body: `Added to Model History by the cloud routine and published automatically after the checks passed (branch \`${process.env.GITHUB_REF_NAME}\`).` });
                await github.rest.issues.update({ ...context.repo, issue_number: Number(n), state: "closed", state_reason: "completed" });
              } catch (e) { core.warning(`issue #${n}: ${e.message}`); }
            }
            try { await github.rest.git.deleteRef({ ...context.repo, ref: `heads/${process.env.GITHUB_REF_NAME}` }); } catch {}
            await github.rest.actions.createWorkflowDispatch({ ...context.repo, workflow_id: "model-history.yml", ref: "main" });
            core.info(`Closed ${issues.join(", ") || "no issues"}; Model History build started.`);
      - name: Report a failure on the linked issues
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.ref.replace("refs/heads/", "");
            const msg = context.payload.head_commit ? context.payload.head_commit.message : "";
            const all = (context.payload.commits || []).map(c => c.message).concat(msg).join("\n");
            const issues = [...new Set(all.match(/(?<=\b(?:Closes|Fixes|Resolves) #)\d+/gi) || [])];
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            for (const n of issues) await github.rest.issues.createComment({ ...context.repo, issue_number: Number(n),
              body: `The cloud routine pushed \`${branch}\` for this issue, but the automatic checks failed, so nothing was published. See ${run}. The branch is kept for review.` });
